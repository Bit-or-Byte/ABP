<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar senha · Metodologias Scrum</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Jost:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="pagina">

    <div class="logo" role="img" aria-label="Metodologias Scrum">
      <div class="logo__texto" aria-hidden="true">
        <span class="logo__sub">METODOLOGIAS</span>
        <span class="logo__nome">SCRUM</span>
      </div>
      <svg class="logo__icone" viewBox="0 0 80 80" aria-hidden="true">
        <rect x="26" y="2" width="44" height="44" fill="#a9a4f7" transform="rotate(-7 48 24)"/>
        <path d="M8 56 L32 52 V47 H38 V51 L48 50 V45 H54 V49 L64 48 V43 H70 V66 L58 74 Z" fill="#5b51c9"/>
        <rect x="1" y="50" width="9" height="9" fill="#a9a4f7"/>
        <rect x="66" y="68" width="11" height="11" fill="#a9a4f7"/>
      </svg>
    </div>

    <section class="card" aria-labelledby="titulo-recuperar">
      <h1 class="card__titulo" id="titulo-recuperar">Recuperar senha</h1>
      <p class="card__descricao">Informe o CPF e o e-mail cadastrados para receber um link de redefinição.</p>

      <!-- A mensagem de sucesso é sempre a mesma, exista a conta ou não,
           para não revelar quais CPFs estão cadastrados. -->
      <form class="form" data-validar data-endpoint="/api/auth/recuperar-senha"
            data-sucesso="Se os dados conferirem, enviaremos um link para o seu e-mail em alguns minutos."
            novalidate>
        <div class="campo">
          <label class="sr-only" for="cpf">CPF</label>
          <div class="campo__caixa campo__caixa--icone">
            <svg class="campo__icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <circle cx="12" cy="8" r="4"/>
              <path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7" stroke-linecap="round"/>
            </svg>
            <input class="campo__input" type="text" id="cpf" name="cpf"
                   placeholder="Digite seu CPF" inputmode="numeric" maxlength="14"
                   autocomplete="username" data-cpf required aria-describedby="cpf-erro">
          </div>
          <span class="campo__erro" id="cpf-erro" aria-live="polite"></span>
        </div>

        <div class="campo">
          <label class="sr-only" for="email">E-mail</label>
          <div class="campo__caixa campo__caixa--icone">
            <svg class="campo__icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <rect x="3" y="5" width="18" height="14" rx="2"/>
              <path d="M3.5 6.5 12 13l8.5-6.5" stroke-linejoin="round"/>
            </svg>
            <input class="campo__input" type="email" id="email" name="email"
                   placeholder="Digite seu e-mail" autocomplete="email" required
                   aria-describedby="email-erro">
          </div>
          <span class="campo__erro" id="email-erro" aria-live="polite"></span>
        </div>

        <p class="aviso" role="status"></p>

        <button class="btn" type="submit">Enviar link</button>
      </form>
    </section>

    <a class="link-secundario" href="login.html">Voltar para o login</a>
  </main>

  <footer class="rodape">
    Ainda não tem uma conta? <a href="cadastro.html">Cadastre-se</a>
  </footer>

  <script src="js/form.js"></script>
</body>
</html>
